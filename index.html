<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StatHive Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d0f16;
      --surface: #161923;
      --surface-2: #1e2230;
      --surface-3: #262b3d;
      --border: rgba(255, 255, 255, 0.08);
      --border-soft: rgba(255, 255, 255, 0.05);
      --text: #eef0f6;
      --text-dim: #9aa1b5;
      --text-faint: #6b7286;
      --accent: #5865f2;
      --accent-hover: #6f7bf5;
      --success: #57f287;
      --danger: #ed4245;
      --danger-soft: rgba(237, 66, 69, 0.15);
      --warning: #f5a623;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 11px;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 15% 0%, #171b2b 0%, var(--bg) 45%);
      color: var(--text);
      min-height: 100vh;
    }
    #app { min-height: 100vh; display: flex; flex-direction: column; }
    .loading-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .spinner { width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--border); border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .setup-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 48px 44px; text-align: center; max-width: 480px; }
    .setup-card h1 { font-size: 22px; margin: 0 0 8px; font-weight: 700; }
    .setup-card p { color: var(--text-dim); font-size: 14px; margin: 0 0 20px; line-height: 1.6; }
    .code-block { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; font-family: monospace; font-size: 12px; text-align: left; word-break: break-all; margin-bottom: 16px; color: var(--text-faint); }

    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 28px; border-bottom: 1px solid var(--border-soft); position: sticky; top: 0; background: rgba(13, 15, 22, 0.85); backdrop-filter: blur(10px); z-index: 10; }
    .topbar-left { display: flex; align-items: center; gap: 14px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; text-decoration: none; color: var(--text); }
    .brand .logo-sm { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), #8b5cf6); display: flex; align-items: center; justify-content: center; font-size: 15px; }
    .guild-chip { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
    .guild-chip .icon { width: 26px; height: 26px; border-radius: 8px; background: var(--surface-3); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
    .crumb-sep { color: var(--text-faint); }

    .page { max-width: 980px; margin: 0 auto; padding: 32px 24px 80px; width: 100%; flex: 1; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .page-header h1 { font-size: 22px; margin: 0; font-weight: 800; }
    .page-header p { color: var(--text-dim); font-size: 14px; margin: 4px 0 0; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: var(--radius-sm); padding: 11px 20px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .btn-secondary { background: var(--surface-3); color: var(--text); }
    .btn-secondary:hover { background: #303650; }
    .btn-danger { background: var(--danger-soft); color: #ff8183; }
    .btn-danger:hover { background: rgba(237, 66, 69, 0.28); }
    .btn-sm { padding: 7px 14px; font-size: 13px; }

    .guild-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .guild-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; cursor: pointer; transition: all 0.15s ease; }
    .guild-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .guild-card .icon { width: 64px; height: 64px; border-radius: 18px; background: var(--surface-3); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; }
    .guild-card .name { font-weight: 600; font-size: 14px; }

    .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--border-soft); margin-bottom: 24px; }
    .tab { padding: 10px 18px; font-size: 14px; font-weight: 600; color: var(--text-dim); cursor: pointer; border-radius: var(--radius-sm) var(--radius-sm) 0 0; border-bottom: 2px solid transparent; }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; }
    .status-list { display: flex; flex-direction: column; gap: 12px; }
    .status-card { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--surface-3); border-radius: var(--radius-md); padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .status-card .info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .status-card .info .name { font-weight: 700; font-size: 15px; }
    .status-card .info .meta { font-size: 12.5px; color: var(--text-dim); display: flex; gap: 10px; flex-wrap: wrap; }
    .status-card .actions { display: flex; gap: 8px; }
    .status-card.online { border-left-color: var(--success); }
    .status-card.offline { border-left-color: var(--danger); }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--border); }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(5, 6, 10, 0.65); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100; backdrop-filter: blur(2px); }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 28px; width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; }
    .modal h2 { margin: 0 0 20px; font-size: 18px; font-weight: 800; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }

    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-dim); }
    input, select { width: 100%; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); padding: 10px 13px; font-family: inherit; font-size: 14px; }
    input:focus, select:focus { outline: none; border-color: var(--accent); }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 560px) { .field-row { grid-template-columns: 1fr; } }

    .toast-stack { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 200; }
    .toast { background: var(--surface-3); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 16px; font-size: 13.5px; box-shadow: var(--shadow); max-width: 320px; animation: toast-in 0.2s ease; }
    .toast.success { border-color: rgba(87, 242, 135, 0.4); color: #8ff5b0; }
    .toast.error { border-color: rgba(237, 66, 69, 0.4); color: #ff9d9e; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div id="app">
    <div class="loading-screen"><div class="spinner"></div></div>
  </div>

  <script src="/config.js"></script>
  <script>
    const app = document.getElementById("app");

    // Get API URL and key from environment (Vercel env vars)
    // window.ENV is set by config.js which reads from process.env (Vercel) or localStorage (browser)
    const API_URL = (window.ENV?.API_URL ?? "http://localhost:4000").replace(/\/$/, "");
    const API_KEY = window.ENV?.API_KEY || "";

    if (!API_KEY) {
      app.innerHTML = `
        <div class="loading-screen">
          <div class="setup-card">
            <h1>⚙️ Setup Required</h1>
            <p>The dashboard needs an API key to talk to your bot on the VPS.</p>
            <p><strong>On Vercel:</strong> Add these environment variables in your project settings:</p>
            <div class="code-block">REACT_APP_API_URL=https://your-vps-ip-or-domain:4000<br>REACT_APP_API_KEY=your_api_key_here</div>
            <p style="font-size:12px;color:var(--text-faint);">Get the API key from your VPS bot logs when it starts.</p>
          </div>
        </div>`;
      throw new Error("Missing API configuration");
    }

    async function api(path, options = {}) {
      const res = await fetch(`${API_URL}${path}`, {
        method: options.method || "GET",
        headers: {
          ...(options.body ? { "Content-Type": "application/json" } : {}),
          "Authorization": `Bearer ${API_KEY}`,
        },
        body: options.body ? JSON.stringify(options.body) : undefined,
      });
      if (res.status === 204) return null;
      let data;
      try { data = await res.json(); } catch {}
      if (!res.ok) throw new Error((data?.error) || `Request failed (${res.status})`);
      return data;
    }

    function toast(message, type = "success") {
      let stack = document.querySelector(".toast-stack");
      if (!stack) { stack = document.createElement("div"); stack.className = "toast-stack"; document.body.appendChild(stack); }
      const el = document.createElement("div");
      el.className = `toast ${type}`;
      el.textContent = message;
      stack.appendChild(el);
      setTimeout(() => el.remove(), 4500);
    }

    function escapeHtml(str) {
      return String(str || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    const state = { guildId: null, activeTab: "statuses" };

    function navigate(path) {
      history.pushState({}, "", path);
      render();
    }
    window.addEventListener("popstate", render);

    async function render() {
      const path = location.pathname;
      const guildMatch = path.match(/^\/g\/([0-9]+)/);

      if (guildMatch) {
        state.guildId = guildMatch[1];
        renderGuildDashboard(state.guildId);
      } else {
        renderPicker();
      }
    }

    async function renderPicker() {
      // List guilds — we only show guilds the bot is in. User has to enter the guild ID.
      app.innerHTML = `
        <div class="loading-screen">
          <div class="setup-card">
            <h1>🐝 StatHive Dashboard</h1>
            <p>Enter your server ID to manage its status cards and bot appearance.</p>
            <div class="field">
              <label>Server/Guild ID</label>
              <input type="text" id="guild-id-input" placeholder="123456789012345678" />
            </div>
            <button class="btn btn-primary btn-block" id="connect-btn">Connect to server</button>
            <p style="font-size:12px;color:var(--text-faint);margin-top:20px;">To find your server ID: right-click your server in Discord, copy server ID.</p>
          </div>
        </div>`;
      document.getElementById("connect-btn").addEventListener("click", async () => {
        const guildId = document.getElementById("guild-id-input").value.trim();
        if (!guildId || !/^\d+$/.test(guildId)) {
          toast("Invalid server ID", "error");
          return;
        }
        try {
          await api(`/api/guilds/${guildId}`);
          navigate(`/g/${guildId}`);
        } catch (err) {
          toast(`${err.message}`, "error");
        }
      });
    }

    async function renderGuildDashboard(guildId) {
      app.innerHTML = `<div class="loading-screen"><div class="spinner"></div></div>`;

      let guild;
      try {
        guild = await api(`/api/guilds/${guildId}`);
      } catch (err) {
        app.innerHTML = `
          <div class="loading-screen">
            <div class="card" style="max-width:420px;text-align:center;">
              <p style="color:var(--text-dim);">${escapeHtml(err.message)}</p>
              <button class="btn btn-secondary" onclick="location.href='/'">Go back</button>
            </div>
          </div>`;
        return;
      }

      app.innerHTML = `
        <div class="topbar">
          <div class="topbar-left">
            <a class="brand" href="/" onclick="history.pushState({}, '', '/'); render(); return false;"><span class="logo-sm">🐝</span> StatHive</a>
            <span class="crumb-sep">/</span>
            <div class="guild-chip"><span class="icon">${guild.name[0] || "?"}</span>${escapeHtml(guild.name)}</div>
          </div>
        </div>
        <div class="page">
          <div class="tabs">
            <div class="tab ${state.activeTab === "statuses" ? "active" : ""}" data-tab="statuses">Statuses</div>
            <div class="tab ${state.activeTab === "profile" ? "active" : ""}" data-tab="profile">Bot Profile</div>
          </div>
          <div id="tab-content"></div>
        </div>`;

      document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
        state.activeTab = t.dataset.tab;
        renderGuildDashboard(guildId);
      }));

      if (state.activeTab === "statuses") renderStatusesTab(guildId);
      else renderProfileTab(guildId);
    }

    async function renderStatusesTab(guildId) {
      const content = document.getElementById("tab-content");
      content.innerHTML = `
        <div class="page-header">
          <div><h1 style="font-size:17px;">Tracked statuses</h1><p>Every FiveM server status card posted in this server.</p></div>
          <button class="btn btn-primary" id="new-status-btn">+ New Status</button>
        </div>
        <div id="status-list" class="status-list"><div class="spinner" style="margin: 30px auto;"></div></div>`;

      document.getElementById("new-status-btn").addEventListener("click", () => openStatusModal(guildId));

      try {
        const statuses = await api(`/api/guilds/${guildId}/statuses`);
        const list = document.getElementById("status-list");
        if (statuses.length === 0) {
          list.outerHTML = `<div class="empty-state">No statuses tracked yet. Click <strong>New Status</strong> to add one.</div>`;
          return;
        }
        list.innerHTML = statuses.map(s => `
          <div class="status-card">
            <div class="info">
              <div class="name">${escapeHtml(s.serverName)}</div>
              <div class="meta"><span>🎯 ${escapeHtml(s.serverCode || s.serverAddress || "unknown")}</span><span>#${escapeHtml(s.channelId)}</span></div>
            </div>
            <div class="actions">
              <button class="btn btn-secondary btn-sm" data-edit="${s.messageId}">Edit</button>
              <button class="btn btn-danger btn-sm" data-delete="${s.messageId}">Delete</button>
            </div>
          </div>`).join("");

        statuses.forEach(s => {
          document.querySelector(`[data-edit="${s.messageId}"]`)?.addEventListener("click", () => openStatusModal(guildId, s));
          document.querySelector(`[data-delete="${s.messageId}"]`)?.addEventListener("click", () => {
            if (confirm(`Delete "${s.serverName}"?`)) deleteStatus(guildId, s.messageId);
          });
        });
      } catch (err) {
        document.getElementById("status-list").outerHTML = `<div style="color:#ff9d9e;padding:20px;">${escapeHtml(err.message)}</div>`;
      }
    }

    async function deleteStatus(guildId, messageId) {
      try {
        await api(`/api/guilds/${guildId}/statuses/${messageId}`, { method: "DELETE" });
        toast("Status deleted.");
        renderStatusesTab(guildId);
      } catch (err) {
        toast(err.message, "error");
      }
    }

    async function openStatusModal(guildId, existing = null) {
      const backdrop = document.createElement("div");
      backdrop.className = "modal-backdrop";
      backdrop.innerHTML = `
        <div class="modal">
          <h2>${existing ? "Edit status" : "New status"}</h2>
          <form id="status-form">
            <div class="field">
              <label>Channel</label>
              <select name="channelId" ${existing ? "disabled" : ""} required>
                <option value="">Loading channels...</option>
              </select>
            </div>
            <div class="field"><label>Server name</label><input type="text" name="serverName" value="${escapeHtml(existing?.serverName || "")}" required /></div>
            <div class="field-row">
              <div class="field"><label>Server IP:Port</label><input type="text" name="serverAddress" placeholder="1.2.3.4:30120" value="${escapeHtml(existing?.serverAddress || "")}" /></div>
              <div class="field"><label>CFX code</label><input type="text" name="cfxCode" placeholder="cfx.re/join/abc123" value="${escapeHtml(existing?.serverCode || "")}" /></div>
            </div>
            <div class="modal-actions">
              <button type="button" class="btn btn-secondary" id="cancel-modal">Cancel</button>
              <button type="submit" class="btn btn-primary">${existing ? "Save changes" : "Create status"}</button>
            </div>
          </form>
        </div>`;
      document.body.appendChild(backdrop);
      backdrop.addEventListener("click", (e) => { if (e.target === backdrop) backdrop.remove(); });
      document.getElementById("cancel-modal").addEventListener("click", () => backdrop.remove());

      const channelSelect = backdrop.querySelector('select[name="channelId"]');
      try {
        const channels = await api(`/api/guilds/${guildId}/channels`);
        channelSelect.innerHTML = `<option value="">Select a channel...</option>` +
          channels.map(c => `<option value="${c.id}" ${existing?.channelId === c.id ? "selected" : ""}>#${escapeHtml(c.name)}</option>`).join("");
      } catch (err) {
        channelSelect.innerHTML = `<option value="">Failed to load</option>`;
      }

      document.getElementById("status-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const body = {
          channelId: existing ? existing.channelId : formData.get("channelId"),
          serverName: formData.get("serverName"),
          serverAddress: formData.get("serverAddress"),
          cfxCode: formData.get("cfxCode"),
          buttons: [],
        };

        try {
          if (existing) {
            await api(`/api/guilds/${guildId}/statuses/${existing.messageId}`, { method: "PATCH", body });
            toast("Status updated.");
          } else {
            await api(`/api/guilds/${guildId}/statuses`, { method: "POST", body });
            toast("Status created.");
          }
          backdrop.remove();
          renderStatusesTab(guildId);
        } catch (err) {
          toast(err.message, "error");
        }
      });
    }

    async function renderProfileTab(guildId) {
      const content = document.getElementById("tab-content");
      content.innerHTML = `
        <div class="page-header"><div><h1 style="font-size:17px;">Bot profile</h1><p>Custom nickname and status-card avatar for this server only.</p></div></div>
        <div class="card" style="max-width:520px;">
          <form id="profile-form">
            <div class="field"><label>Nickname</label><input type="text" name="name" maxlength="32" placeholder="Default bot name" /></div>
            <div class="field"><label>Avatar URL (status cards only)</label><input type="url" name="avatarUrl" placeholder="https://..." /></div>
            <div class="modal-actions" style="justify-content:flex-start;">
              <button type="submit" class="btn btn-primary">Save</button>
              <button type="button" class="btn btn-secondary" id="reset-btn">Reset</button>
            </div>
          </form>
        </div>`;

      const form = document.getElementById("profile-form");
      try {
        const profile = await api(`/api/guilds/${guildId}/profile`);
        form.querySelector('[name="name"]').value = profile.name || "";
        form.querySelector('[name="avatarUrl"]').value = profile.avatarUrl || "";
      } catch (err) {
        toast(`Failed to load profile: ${err.message}`, "error");
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(form);
        try {
          await api(`/api/guilds/${guildId}/profile`, {
            method: "POST",
            body: { name: fd.get("name") || null, avatarUrl: fd.get("avatarUrl") || null },
          });
          toast("Profile saved.");
        } catch (err) {
          toast(err.message, "error");
        }
      });

      document.getElementById("reset-btn").addEventListener("click", async () => {
        if (!confirm("Reset to defaults?")) return;
        try {
          await api(`/api/guilds/${guildId}/profile/reset`, { method: "POST" });
          form.querySelector('[name="name"]').value = "";
          form.querySelector('[name="avatarUrl"]').value = "";
          toast("Profile reset.");
        } catch (err) {
          toast(err.message, "error");
        }
      });
    }

    render();
  </script>
</body>
</html>
